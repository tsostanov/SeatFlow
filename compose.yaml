services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  inventory:
    build:
      context: .
      args:
        SERVICE: inventory
    environment:
      GRPC_ADDR: :50051
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking?sslmode=disable
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  booking:
    build:
      context: .
      args:
        SERVICE: booking
    environment:
      GRPC_ADDR: :50052
      INVENTORY_ADDR: inventory:50051
      BOOKING_TTL: ${BOOKING_TTL:-10m}
    depends_on:
      - inventory
    restart: unless-stopped

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      HTTP_ADDR: :8080
      INVENTORY_ADDR: inventory:50051
      BOOKING_ADDR: booking:50052
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      - inventory
      - booking
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
