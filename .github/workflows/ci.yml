name: Go checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test tests/booking-session.test.mjs tests/seat-recommendation.test.mjs tests/ticket-calendar.test.mjs tests/ticket-share.test.mjs
      - run: test -z "$(gofmt -l cmd internal tests)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -tags=integration ./tests/... -count=1 -v
        env:
          TEST_DATABASE_URL: postgres://booking:booking@localhost:5432/booking_test?sslmode=disable
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 90
        env:
          BOOKING_TTL: 5s
      - run: python3 tests/compose_smoke.py
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
